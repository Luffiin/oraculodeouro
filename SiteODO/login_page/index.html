<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="imagens/logo_oficial_bola_apenas.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section>
        <div class="login-conteiner">
            <img src="imagens/logo_oficial.png" alt="">
            <h1>Oráculo de Ouro&trade;</h1>
            <h2>Entre com sua conta</h2> <br>
            <h2>LOGIN DO PARTICIPANTE</h2> 
        </div>
        <div class="login-input">
            <form>
                <label>Email</label>
                <input type="email" placeholder="Email"> <br>
                <label>Senha</label>
                <input type="password" placeholder="Senha"> <br>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </section>
</body>

</html>
